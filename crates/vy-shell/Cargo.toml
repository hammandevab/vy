[package]
name = "vy-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The Vy client: window, tabs, address bar, one sandboxed process per tab"

[lib]
name = "vy_shell"
path = "src/lib.rs"

[[bin]]
name = "vy-shell"
path = "src/main.rs"

[features]
# The window itself (winit + softbuffer). Off, the crate is the shell's
# model, chrome, tab processes and the headless screenshot pipeline, which
# is what `vy-cli conformance` links.
default = ["window"]
window = ["dep:winit", "dep:softbuffer", "dep:accesskit_winit", "os-clipboard"]
# The system clipboard behind Ctrl+C/V/X (`arboard`); without it the
# window uses an in-memory clipboard, as headless runs always do.
os-clipboard = ["dep:arboard"]
# AT-SPI over D-Bus for the accessibility tree on Linux and the BSDs
# (SPEC-10.2.1). Off by default: +3.1 MB takes the client past SPEC-12.3.1's
# 25 MB. Windows (UIA) and macOS (NSAccessibility) always have it.
a11y-linux = ["window", "accesskit_winit/accesskit_unix", "accesskit_winit/async-io"]

[dependencies]
vy-abi.workspace = true
vy-dl.workspace = true
vy-manifest.workspace = true
vy-proto.workspace = true
vy-render.workspace = true
vy-runtime.workspace = true
getrandom.workspace = true
winit = { workspace = true, optional = true }
softbuffer = { workspace = true, optional = true }
arboard = { workspace = true, optional = true }
accesskit.workspace = true
accesskit_winit = { workspace = true, optional = true }

# `ShellExecuteW` for https:// links (SPEC-2.1.7), instead of `cmd /C start`,
# which parses the URL. The same crate, version and features softbuffer
# already pulls in on Windows: nothing new in the tree.
#
# The tab sandbox (SPEC-9.1.3, src/sandbox.rs): job objects, AppContainer,
# token integrity, mitigation policies, pipes. More features of the same
# crate; no new crate.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }

# seccomp, Landlock and prctl on Linux, sandbox_init's neighbours on macOS:
# the libc crate the tree already has (getrandom, wasmtime), no new crate.
[target.'cfg(unix)'.dependencies]
libc = "0.2"


[dev-dependencies]
wat.workspace = true
