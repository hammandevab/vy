[package]
name = "vy-render"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Software rasterizer and text engine for Vy display lists"

[features]
# The GL pipeline (src/gl.rs) for the window, on a context the caller
# makes; off, the crate has no GPU code. vy-shell turns it on.
gl = ["dep:glow"]

[dependencies]
glow = { workspace = true, optional = true }
vy-abi.workspace = true
vy-dl.workspace = true
tiny-skia.workspace = true
cosmic-text.workspace = true
unicode-script.workspace = true
png.workspace = true
