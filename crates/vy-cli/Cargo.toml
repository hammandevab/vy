[package]
name = "vy-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Headless tools: check-abi, render, conformance, bench"

[[bin]]
name = "vy-cli"
path = "src/main.rs"

[dependencies]
vy-abi.workspace = true
vy-dl.workspace = true
vy-manifest.workspace = true
vy-runtime.workspace = true
vy-render.workspace = true
# The shell's model without its window: `conformance` renders the chrome
# cases through it (with this binary as the tab process) and `bench`
# measures a tab process's cold start.
vy-shell = { workspace = true, default-features = false }
# The network class of a shell case's page (SPEC-9.5.3); already in the
# tree through vy-shell.
vy-proto.workspace = true
anyhow.workspace = true
png.workspace = true
# `bench --json` and its committed baselines (SPEC-12.2.3); both crates are
# already in the tree through vy-manifest, so nothing new is pulled in.
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# SPEC-13.1.3 (bench_tests.rs): a package built and served on loopback, as
# the publisher builds and the server serves it (and fetched with vy-proto,
# above); workspace crates, test-only.
vy-publish.workspace = true
vy-serve.workspace = true
wat.workspace = true
