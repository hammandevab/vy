[package]
name = "block"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Vy example page: a falling-blocks puzzle game with a 7-bag, wall kicks, hold, ghost piece and a stored high score"

[lib]
crate-type = ["cdylib"]

[dependencies]
vy-sdk = { path = "../../crates/vy-sdk" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
panic = "abort"

[workspace]
