[package]
name = "document"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Vy reference module 5: a report with byline, responsive two-column body, data table, footnotes and keyboard focus across links"

[lib]
crate-type = ["cdylib"]

[dependencies]
vy-sdk = { path = "../../crates/vy-sdk" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
panic = "abort"

[workspace]
