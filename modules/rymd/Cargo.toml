[package]
name = "rymd"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Vy example page: a software-rendered 3D scene of filled PATH triangles with flat shading, culling and depth sorting, over a parallax starfield"

[lib]
crate-type = ["cdylib"]

[dependencies]
vy-sdk = { path = "../../crates/vy-sdk" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
panic = "abort"

[workspace]
