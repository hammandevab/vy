[package]
name = "list"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Vy reference module 3: a virtualised list of 200 rows with selection, keyboard navigation and a detail dialog"

[lib]
crate-type = ["cdylib"]

[dependencies]
vy-sdk = { path = "../../crates/vy-sdk" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
panic = "abort"

[workspace]
