[package]
name = "form"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Vy reference module 2: text fields with focus and IME, a checkbox and a submit button"

[lib]
crate-type = ["cdylib"]

[dependencies]
vy-sdk = { path = "../../crates/vy-sdk" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
panic = "abort"

[workspace]
