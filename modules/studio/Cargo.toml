[package]
name = "studio"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Vy Studio: write a mission, let Claude Code build the page through vy-dev, watch the agent and the build"

[lib]
crate-type = ["cdylib"]

[dependencies]
vy-sdk = { path = "../../crates/vy-sdk" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
panic = "abort"

[workspace]
