[package]
name = "kanban"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Vy example page: a three-column kanban board with drag and drop, keyboard moves, inline editing and storage"

[lib]
crate-type = ["cdylib"]

[dependencies]
vy-sdk = { path = "../../crates/vy-sdk" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
panic = "abort"

[workspace]
