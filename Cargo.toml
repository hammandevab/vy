[workspace]
resolver = "2"
members = [
    "crates/vy-abi",
    "crates/vy-manifest",
    "crates/vy-proto",
    "crates/vy-dl",
    "crates/vy-runtime",
    "crates/vy-render",
    "crates/vy-sdk",
    "crates/vy-shell",
    "crates/vy-cli",
    "crates/vy-publish",
    "crates/vy-serve",
]
# modules/* byggs separat för wasm32 (tools/build_modules.sh)
exclude = ["modules"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/hammandevab/vy"
rust-version = "1.97"

[workspace.dependencies]
vy-abi = { path = "crates/vy-abi" }
vy-dl = { path = "crates/vy-dl" }
vy-manifest = { path = "crates/vy-manifest" }
vy-render = { path = "crates/vy-render" }
vy-runtime = { path = "crates/vy-runtime" }
vy-sdk = { path = "crates/vy-sdk" }
anyhow = "1"
wasmparser = "0.220"
# wasmtime without default features: no component model, no async, no GC, no
# threads (SPEC-4.2.3), no cache, no parallel compilation, no profiling.
wasmtime = { version = "50", default-features = false, features = ["cranelift", "runtime", "std"] }
sha2 = { version = "0.11", default-features = false }
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
cosmic-text = { version = "0.19", default-features = false, features = ["std", "swash"] }
# Only to name `Script` in cosmic-text's `Fallback` trait; same version cosmic-text uses.
unicode-script = "0.5"
png = "0.18"
wat = "1"
# M3 (vy-manifest, vy-proto, vy-publish, vy-serve); motiveringar i docs/notes/m3-proto-serve.md.
vy-proto = { path = "crates/vy-proto" }
vy-publish = { path = "crates/vy-publish" }
vy-serve = { path = "crates/vy-serve" }
vy-shell = { path = "crates/vy-shell", default-features = false }
# CBOR tokenizer only (no derive, no serde, no f16): the canonical checks of
# SPEC-4.1.3 are done on top of it in vy-manifest::cbor.
minicbor = { version = "2", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Ed25519 without rand_core/pkcs8/pem; keys are raw 32-byte seeds.
ed25519-dalek = { version = "3", default-features = false, features = ["fast", "alloc"] }
# Reference zstd (C, via zstd-sys); no legacy formats, no dictionaries.
zstd = { version = "0.14", default-features = false }
# Blocking HTTPS client: rustls with ring and bundled Mozilla roots, no gzip, no cookies.
ureq = { version = "3", default-features = false, features = ["rustls"] }
tiny_http = "0.12"
# OS entropy for `vy-publish keygen` and the key of each tab's CSPRNG in
# vy-shell (same version ring uses).
getrandom = "0.2"
# M3 del 2 (vy-shell); motiveringar i docs/notes/m3-shell.md.
# Window, input and DPI on Windows, macOS, X11 and Wayland. No client-side
# decorations on Wayland (saves sctk-adwaita and a font stack); X11 and
# Wayland libraries are loaded at run time, so nothing is needed to build.
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
# Presents a CPU-rasterized frame to the window without a GPU context
# (the wgpu path is M4/M5). No KMS/DRM backend.
softbuffer = { version = "0.4", default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"] }
# M4 (vy-shell); motiveringar i docs/notes/m4-ux.md.
# The system clipboard for Ctrl+C/V/X: text only (no `image-data`, which
# pulls in `image`); X11 on Linux (no `wayland-data-control`: XWayland
# bridges the selection), clipboard-win on Windows, NSPasteboard on macOS.
arboard = { version = "3.7", default-features = false }
# The platform's accessibility API for the semantic tree (SPEC-10.2.1): the
# schema crate (always; the tree conversion is tested without a window)
# and the winit adapter (UIA on Windows, NSAccessibility on macOS). AT-SPI
# on Linux (`accesskit_unix`, zbus) is vy-shell's opt-in `a11y-linux`
# feature: it adds 3.1 MB, which takes the Linux client past 25 MB.
accesskit = "0.25"
accesskit_winit = { version = "0.34", default-features = false, features = ["rwh_06"] }

[profile.release]
lto = "thin"
codegen-units = 1
# Symbols and debug info are not shipped: the client binary is capped at
# 25 MB (SPEC-12.3.1) and release.yml zips what this profile produces.
strip = true
