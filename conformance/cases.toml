module = "game"
width = 800
height = 600
scale = 1
semantic = "game"

[[case]]
name = "game-800x600@1-running"
module = "game"
width = 800
height = 600
scale = 1
semantic = "game-running"
frames = 60
events = [
  {kind = "key_down", code = 80},                   # pil vänster: ett steg, hålls sedan
