# chat: meddelandetråd med bubblor, tidsstämplar från now_ms, kompositör med IME och
# sändning via fetch_begin (modules/chat). Headless nekar fetch_begin (E_DENIED även med
# `net`), så fallet efter Enter visar det lokala meddelandet som "ej skickat" och en
# offline-banner (SPEC-5.3.1). Kräver `ime` (SPEC-10.4.2). Sidan kan inte fokusera
# kompositören själv (SPEC-10.3.1): tråden öppnas utan fokus, Tab ger kompositören fokus.

[[case]]
name = "chat-800x600@1"
module = "chat"
width = 800
height = 600
scale = 1
semantic = "chat"
capabilities = ["ime", "net"]

[[case]]
name = "chat-800x600@1-sent"
module = "chat"
width = 800
height = 600
scale = 1
semantic = "chat-sent"
capabilities = ["ime", "net"]
