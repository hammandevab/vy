# Konformansfall (SPEC-12.2.2). Varje fall renderar target/wasm/<module>.wasm
# headless och jämförs med golden/<name>.png; högst 0,1 % pixlar får avvika.
# Ett fall med `semantic` jämför även det semantiska trädet med semantic/<semantic>.json
# (SPEC-10.2.3). Guldbyte: `cargo run -p vy-cli -- conformance --update` i ett eget
# commit med prefixet `golden:`.
#
# Formatet är en delmängd av TOML: [[case]]-tabeller med name, module, width, height,
# scale (standard 1), frames (standard 1 + antal events; ett tak – vy_frame anropas bara så
# länge modulen begär en ny frame, SPEC-6.2.1), semantic, capabilities (lista med namn ur
# SPEC-8.2.1), resources (lista med filer relativt repots rot; resources[i] blir resurs-id
# i + 1, SPEC-4.5.1) och events (lista med inline-tabeller: pointer_move/down/up med x, y;
# key_down/up med code (USB HID); text_input med text; scroll med dx, dy, lines).

[[case]]
name = "hello-800x600@1"
module = "hello"
width = 800
height = 600
scale = 1
semantic = "hello"

[[case]]
name = "hello-1280x800@1"
module = "hello"
width = 1280
height = 800
scale = 1

[[case]]
name = "hello-400x700@1"
module = "hello"
width = 400
height = 700
scale = 1

[[case]]
name = "hello-800x600@2"
module = "hello"
width = 800
height = 600
scale = 2

# text: lång artikel med rubriker, citat och rullning (modules/text). Händelser
# (`events`) spelas upp efter första framen; `frames` är då 1 + antal händelser.

[[case]]
name = "text-800x600@1"
module = "text"
width = 800
height = 600
scale = 1
semantic = "text"

[[case]]
name = "text-800x600@1-scrolled"
module = "text"
width = 800
height = 600
scale = 1
semantic = "text-scrolled"
events = [
  {kind = "scroll", dy = 120},
  {kind = "scroll", dy = 120},
  {kind = "scroll", dy = 5, lines = true},   # 5 rader à 24 px
  {kind = "key_down", code = 78},            # Page Down
  {kind = "key_up", code = 78},
  {kind = "key_down", code = 81},            # pil ned
]

[[case]]
name = "text-400x700@1"
module = "text"
width = 400
height = 700
scale = 1

[[case]]
name = "text-400x700@1-end"
module = "text"
width = 400
height = 700
scale = 1
events = [{kind = "key_down", code = 77}]    # End: klampas mot artikelns slut

[[case]]
name = "text-1024x768@1.5"
module = "text"
width = 1024
height = 768
scale = 1.5

# form: textfält med fokus och IME, kryssruta och skicka-knapp (modules/form).
# Sidan har textbox-noder och måste beviljas `ime` (SPEC-10.4.2).

[[case]]
name = "form-800x600@1"
module = "form"
width = 800
height = 600
scale = 1
semantic = "form"
capabilities = ["ime"]

[[case]]
name = "form-800x600@1-filled"
module = "form"
width = 800
height = 600
scale = 1
semantic = "form-filled"
capabilities = ["ime"]
events = [
  {kind = "pointer_down", x = 300, y = 183},       # namnfältet får fokus, ime_begin
  {kind = "pointer_up", x = 300, y = 183},
  {kind = "text_input", text = "Anna Lindd"},
  {kind = "key_down", code = 42},                   # Backspace
  {kind = "key_down", code = 43},                   # Tab: e-postfältet
  {kind = "text_input", text = "anna@exempel.se"},
  {kind = "pointer_down", x = 214, y = 313},       # kryssrutan
]

[[case]]
name = "form-800x600@1-submitted"
module = "form"
width = 800
height = 600
scale = 1
semantic = "form-submitted"
capabilities = ["ime"]
events = [
  {kind = "pointer_down", x = 300, y = 183},
  {kind = "text_input", text = "Anna Lind"},
  {kind = "key_down", code = 43},
  {kind = "text_input", text = "anna@exempel.se"},
  {kind = "pointer_down", x = 400, y = 370},       # Skicka
]

[[case]]
name = "form-800x600@1-error"
module = "form"
width = 800
height = 600
scale = 1
capabilities = ["ime"]
events = [{kind = "pointer_down", x = 400, y = 370}]   # Skicka utan namn: fel och fokus på namn

[[case]]
name = "form-400x700@2"
module = "form"
width = 400
height = 700
scale = 2
capabilities = ["ime"]
events = [                                         # enbart tangentbord (SPEC-10.3.1)
  {kind = "key_down", code = 43},                   # Tab: namn
  {kind = "text_input", text = "Åsa Öberg"},
  {kind = "key_down", code = 43},                   # Tab: e-post
  {kind = "text_input", text = "asa@exempel.se"},
  {kind = "key_down", code = 43},                   # Tab: kryssruta
  {kind = "key_down", code = 44},                   # mellanslag: kryssa i
  {kind = "key_down", code = 43},                   # Tab: Skicka
  {kind = "key_down", code = 40},                   # Enter
]

# list: 200 rader med markering, tangentbordsnavigering och detaljdialog (modules/list).

[[case]]
name = "list-800x600@1"
module = "list"
width = 800
height = 600
scale = 1
semantic = "list"

[[case]]
name = "list-800x600@1-opened"
module = "list"
width = 800
height = 600
scale = 1
semantic = "list-opened"
events = [                                         # pil ned x12 rullar rad 13 in i bild, Enter öppnar
  {kind = "key_down", code = 81}, {kind = "key_down", code = 81}, {kind = "key_down", code = 81},
  {kind = "key_down", code = 81}, {kind = "key_down", code = 81}, {kind = "key_down", code = 81},
  {kind = "key_down", code = 81}, {kind = "key_down", code = 81}, {kind = "key_down", code = 81},
  {kind = "key_down", code = 81}, {kind = "key_down", code = 81}, {kind = "key_down", code = 81},
  {kind = "key_down", code = 40},                   # Enter
]

[[case]]
name = "list-400x700@2"
module = "list"
width = 400
height = 700
scale = 2
events = [
  {kind = "scroll", dy = 300},                      # pixlar
  {kind = "scroll", dy = 2, lines = true},          # 2 rader à 56 px
  {kind = "pointer_down", x = 200, y = 300},       # markerar raden under pekaren
  {kind = "pointer_up", x = 200, y = 300},
]

# gallery: åtta PNG-resurser i rutnät med cover/contain/stretch och en ljuslåda
# (modules/gallery). Resurserna ges i ordning: resources[i] är resurs-id i + 1.

[[case]]
name = "gallery-800x600@1"
module = "gallery"
width = 800
height = 600
scale = 1
semantic = "gallery"
resources = [
  "modules/gallery/res/01-ringar.png", "modules/gallery/res/02-rutor.png",
  "modules/gallery/res/03-vagor.png", "modules/gallery/res/04-diagonal.png",
  "modules/gallery/res/05-prickar.png", "modules/gallery/res/06-spiral.png",
  "modules/gallery/res/07-rutnat.png", "modules/gallery/res/08-solnedgang.png",
]

[[case]]
name = "gallery-800x600@1-opened"
module = "gallery"
width = 800
height = 600
scale = 1
semantic = "gallery-opened"
resources = [
  "modules/gallery/res/01-ringar.png", "modules/gallery/res/02-rutor.png",
  "modules/gallery/res/03-vagor.png", "modules/gallery/res/04-diagonal.png",
  "modules/gallery/res/05-prickar.png", "modules/gallery/res/06-spiral.png",
  "modules/gallery/res/07-rutnat.png", "modules/gallery/res/08-solnedgang.png",
]
events = [
  {kind = "pointer_down", x = 400, y = 170},       # andra bilden (Rutor, contain)
  {kind = "pointer_up", x = 400, y = 170},
  {kind = "key_down", code = 79},                   # pil höger: tredje bilden (Vågor)
]

[[case]]
name = "gallery-1024x768@1.5"
module = "gallery"
width = 1024
height = 768
scale = 1.5
resources = [
  "modules/gallery/res/01-ringar.png", "modules/gallery/res/02-rutor.png",
  "modules/gallery/res/03-vagor.png", "modules/gallery/res/04-diagonal.png",
  "modules/gallery/res/05-prickar.png", "modules/gallery/res/06-spiral.png",
  "modules/gallery/res/07-rutnat.png", "modules/gallery/res/08-solnedgang.png",
]

[[case]]
name = "gallery-400x700@1-end"
module = "gallery"
width = 400
height = 700
scale = 1
resources = [
  "modules/gallery/res/01-ringar.png", "modules/gallery/res/02-rutor.png",
  "modules/gallery/res/03-vagor.png", "modules/gallery/res/04-diagonal.png",
  "modules/gallery/res/05-prickar.png", "modules/gallery/res/06-spiral.png",
  "modules/gallery/res/07-rutnat.png", "modules/gallery/res/08-solnedgang.png",
]
events = [
  {kind = "scroll", dy = 500},                      # en kolumn: rullning i pixlar
  {kind = "key_down", code = 77},                   # End: klampas mot sista raden
]

# game: paddel och boll (modules/game). Sidan begär en frame per frame bara medan bollen
# är i spel, så `frames` är ett tak som nås först efter serven (mellanslag). En nedtryckt
# pil utan key_up hålls kvar i värden och pollas via key_down-importen varje frame.

[[case]]
name = "game-800x600@1"
module = "game"
width = 800
height = 600
scale = 1
semantic = "game"

[[case]]
name = "game-800x600@1-running"
module = "game"
width = 800
height = 600
scale = 1
semantic = "game-running"
frames = 60
events = [
  {kind = "key_down", code = 80},                   # pil vänster: ett steg, hålls sedan
  {kind = "key_down", code = 44},                   # mellanslag: serve, 58 frames à 16 ms
]

[[case]]
name = "game-400x700@1"
module = "game"
width = 400
height = 700
scale = 1
frames = 40
events = [
  {kind = "key_down", code = 44},                   # serve
  {kind = "key_down", code = 79},                   # pil höger efter taket: ingen frame
]

# dashboard: fyra nyckeltal, linjediagram (dl_path) och stapeldiagram (dl_rect) ur en fast
# tabell, förklaring och verktygstips vid POINTER_MOVE (modules/dashboard).

[[case]]
name = "dashboard-1280x800@1"
module = "dashboard"
width = 1280
height = 800
scale = 1
semantic = "dashboard"

[[case]]
name = "dashboard-1280x800@1-hover"
module = "dashboard"
width = 1280
height = 800
scale = 1
semantic = "dashboard-hover"
events = [
  {kind = "pointer_move", x = 521, y = 400},       # september i linjediagrammet
  {kind = "pointer_move", x = 973, y = 526},       # onsdagsstapeln: verktygstips
]

[[case]]
name = "dashboard-800x1000@1.5"
module = "dashboard"
width = 800
height = 1000
scale = 1.5
events = [{kind = "pointer_move", x = 300, y = 500}]   # smal layout, månad i linjediagrammet
