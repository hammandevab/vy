events = [
  {kind = "key_down", code = 40},  # Enter: spelet startar, O faller
  {kind = "key_down", code = 6, after_frames = 2},  # C: O läggs i håll, J faller
  {kind = "key_down", code = 79, after_frames = 2},  # J ett steg höger ...
  {kind = "key_down", code = 44, after_frames = 2},  # ... och släpps: kolumn 5–7
  {kind = "key_down", code = 79, after_frames = 2},  # Z ett steg höger ...
  {kind = "key_down", code = 44, after_frames = 2},  # ... och släpps ovanpå J
  {kind = "key_down", code = 79, after_frames = 2},  # L fyra steg höger ...
  {kind = "key_down", code = 79, after_frames = 1},
  {kind = "key_down", code = 79, after_frames = 1},
  {kind = "key_down", code = 79, after_frames = 1},
  {kind = "key_down", code = 44, after_frames = 2},  # ... och släpps: kolumn 8–10
  {kind = "key_down", code = 79, after_frames = 2},  # S fyra steg höger ...
  {kind = "key_down", code = 79, after_frames = 1},
  {kind = "key_down", code = 79, after_frames = 1},
  {kind = "key_down", code = 79, after_frames = 1},
  {kind = "key_down", code = 44, after_frames = 2},  # ... och släpps ovanpå L
  {kind = "key_down", code = 80, after_frames = 2},  # I tre steg vänster ...
  {kind = "key_down", code = 80, after_frames = 1},
  {kind = "key_down", code = 80, after_frames = 1},
  {kind = "key_down", code = 44, after_frames = 2},  # ... och släpps: nedersta raden är full och blinkar
]

