# Konformansfall (SPEC-12.2.2). Varje fall renderar target/wasm/<module>.wasm
# headless och jämförs med golden/<name>.png; högst 0,1 % pixlar får avvika.
# Ett fall med `semantic` jämför även det semantiska trädet med semantic/<semantic>.json
# (SPEC-10.2.3). Guldbyte: `cargo run -p vy-cli -- conformance --update` i ett eget
# commit med prefixet `golden:`.
#
# Formatet är en delmängd av TOML: [[case]]-tabeller med name, module, width, height,
# scale (standard 1), frames (standard 1; ett tak – vy_frame anropas bara så länge modulen
# begär en ny frame, SPEC-6.2.1) och semantic.

[[case]]
name = "hello-800x600@1"
module = "hello"
width = 800
height = 600
scale = 1
semantic = "hello"

[[case]]
name = "hello-1280x800@1"
module = "hello"
width = 1280
height = 800
scale = 1

[[case]]
name = "hello-400x700@1"
module = "hello"
width = 400
height = 700
scale = 1

[[case]]
name = "hello-800x600@2"
module = "hello"
width = 800
height = 600
scale = 2

# text: lång artikel med rubriker, citat och rullning (modules/text). Händelser
# (`events`) spelas upp efter första framen; `frames` är då 1 + antal händelser.

[[case]]
name = "text-800x600@1"
module = "text"
width = 800
height = 600
scale = 1
semantic = "text"

[[case]]
name = "text-800x600@1-scrolled"
module = "text"
width = 800
height = 600
scale = 1
semantic = "text-scrolled"
events = [
  {kind = "scroll", dy = 120},
  {kind = "scroll", dy = 120},
  {kind = "scroll", dy = 5, lines = true},   # 5 rader à 24 px
  {kind = "key_down", code = 78},            # Page Down
  {kind = "key_up", code = 78},
  {kind = "key_down", code = 81},            # pil ned
]

[[case]]
name = "text-400x700@1"
module = "text"
width = 400
height = 700
scale = 1

[[case]]
name = "text-400x700@1-end"
module = "text"
width = 400
height = 700
scale = 1
events = [{kind = "key_down", code = 77}]    # End: klampas mot artikelns slut

[[case]]
name = "text-1024x768@1.5"
module = "text"
width = 1024
height = 768
scale = 1.5

# form: textfält med fokus och IME, kryssruta och skicka-knapp (modules/form).
# Sidan har textbox-noder och måste beviljas `ime` (SPEC-10.4.2).

[[case]]
name = "form-800x600@1"
module = "form"
width = 800
height = 600
scale = 1
semantic = "form"
capabilities = ["ime"]

[[case]]
name = "form-800x600@1-filled"
module = "form"
width = 800
height = 600
scale = 1
semantic = "form-filled"
capabilities = ["ime"]
events = [
  {kind = "pointer_down", x = 300, y = 183},       # namnfältet får fokus, ime_begin
  {kind = "pointer_up", x = 300, y = 183},
  {kind = "text_input", text = "Anna Lindd"},
  {kind = "key_down", code = 42},                   # Backspace
  {kind = "key_down", code = 43},                   # Tab: e-postfältet
  {kind = "text_input", text = "anna@exempel.se"},
  {kind = "pointer_down", x = 214, y = 313},       # kryssrutan
]

[[case]]
name = "form-800x600@1-submitted"
module = "form"
width = 800
height = 600
scale = 1
semantic = "form-submitted"
capabilities = ["ime"]
events = [
  {kind = "pointer_down", x = 300, y = 183},
  {kind = "text_input", text = "Anna Lind"},
  {kind = "key_down", code = 43},
  {kind = "text_input", text = "anna@exempel.se"},
  {kind = "pointer_down", x = 400, y = 370},       # Skicka
]

[[case]]
name = "form-800x600@1-error"
module = "form"
width = 800
height = 600
scale = 1
capabilities = ["ime"]
events = [{kind = "pointer_down", x = 400, y = 370}]   # Skicka utan namn: fel och fokus på namn

[[case]]
name = "form-400x700@2"
module = "form"
width = 400
height = 700
scale = 2
capabilities = ["ime"]
events = [                                         # enbart tangentbord (SPEC-10.3.1)
  {kind = "key_down", code = 43},                   # Tab: namn
  {kind = "text_input", text = "Åsa Öberg"},
  {kind = "key_down", code = 43},                   # Tab: e-post
  {kind = "text_input", text = "asa@exempel.se"},
  {kind = "key_down", code = 43},                   # Tab: kryssruta
  {kind = "key_down", code = 44},                   # mellanslag: kryssa i
  {kind = "key_down", code = 43},                   # Tab: Skicka
  {kind = "key_down", code = 40},                   # Enter
]
