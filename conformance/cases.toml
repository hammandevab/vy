# efter starten har after_frames och fallen anger `frames`: 1 + summan + de frames som körs efter
# sista händelsen. Bitarnas ordning kommer ur värdens random (SPEC-5.2.11), som huvudlöst ger
# O J Z L S I T i första påsen. Manifestet begär storage (bästa poäng, SPEC-5.2.9).

