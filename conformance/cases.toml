# chat: meddelandetråd med bubblor, tidsstämplar från now_ms, kompositör med IME och
# sändning via fetch_begin (modules/chat). Headless nekar fetch_begin (E_DENIED även med
# `net`), så fallet efter Enter visar det lokala meddelandet som "ej skickat" och en
# offline-banner (SPEC-5.3.1). Kräver `ime` (SPEC-10.4.2). Sidan kan inte fokusera
# kompositören själv (SPEC-10.3.1): tråden öppnas utan fokus, Tab ger kompositören fokus.

[[case]]
name = "chat-800x600@1"
module = "chat"
width = 800
height = 600
scale = 1
semantic = "chat"
capabilities = ["ime", "net"]

[[case]]
name = "chat-800x600@1-sent"
module = "chat"
width = 800
height = 600
scale = 1
semantic = "chat-sent"
capabilities = ["ime", "net"]
events = [
  {kind = "key_down", code = 43},                   # Tab: kompositören (första fokuserbara noden)
  {kind = "text_input", text = "Ja, de ligger i conformance/golden nu."},
  {kind = "key_down", code = 40},                   # Enter: läggs till lokalt, fetch_begin nekas
  {kind = "key_up", code = 40},
  {kind = "text_input", text = "Säg till om"},      # kompositören är fortfarande fokuserad
]

[[case]]
name = "chat-800x600@1-delivered"
module = "chat"
width = 800
height = 600
scale = 1
semantic = "chat-delivered"
capabilities = ["ime", "net"]
fetch = [{url = "https://chat.example/api/messages", status = 200, body = "ok"}]
events = [
  {kind = "key_down", code = 43},                   # Tab: kompositören
  {kind = "text_input", text = "Ja, de ligger i conformance/golden nu."},
  {kind = "key_down", code = 40},                   # Enter: fetch_begin besvaras ur fetch: "skickas"
  {kind = "fetch_done"},                            # FETCH_DONE 200: "levererat", ansluten
]

[[case]]
name = "chat-400x700@2"
module = "chat"
width = 400
height = 700
scale = 2
capabilities = ["ime", "net"]

[[case]]
name = "chat-400x700@2-scrolled"
module = "chat"
width = 400
height = 700
scale = 2
capabilities = ["ime", "net"]
events = [
  {kind = "pointer_down", x = 200, y = 300},        # i tråden: inget fokuserbart under pekaren
  {kind = "scroll", dy = -200},                     # bakåt i tråden
  {kind = "scroll", dy = -3, lines = true},
]

