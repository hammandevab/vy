# Konformansfall (SPEC-12.2.2). Varje fall renderar target/wasm/<module>.wasm
# headless och jämförs med golden/<name>.png; högst 0,1 % pixlar får avvika.
# Ett fall med `semantic` jämför även det semantiska trädet med semantic/<semantic>.json
# (SPEC-10.2.3). Guldbyte: `cargo run -p vy-cli -- conformance --update` i ett eget
# commit med prefixet `golden:`.
#
# Formatet är en delmängd av TOML: strängar är "…" utan escapes eller literalsträngar '…' (som
# får innehålla " men inte ', för inspelade JSON-svar); [[case]]-tabeller med name, module, width, height,
# scale (standard 1), frames (standard 1 + antal events; ett tak – vy_frame anropas bara så
# länge modulen begär en ny frame, SPEC-6.2.1), semantic, capabilities (lista med namn ur
# SPEC-8.2.1; bara vad modulens manifest i manifests/ begär, SPEC-8.2.2), resources (lista med
# filer relativt repots rot som "sökväg" eller {path, w, h} med bildens storlek ur manifestet,
# SPEC-8.1.2; resources[i] blir resurs-id i + 1, SPEC-4.5.1) och events (lista med
# inline-tabeller: pointer_move/down/up med x, y;
# pointer_leave utan argument; key_down/up med code (USB HID); text_input med text; scroll
# med dx, dy, lines; focus med node, gained, keyboard; visibility med visible; budget utan
# argument (nästa frame rapporteras över budget, SPEC-5.3.3); resize med width, height, scale
# (sista storleken är bildens); suspend; reinit (ny instans med den gamlas lagring, SPEC-5.2.9);
# fetch_done (FETCH_DONE för äldsta väntande begäran). Varje händelse kan ha after_frames = N:
# högst N frames körs mellan föregående händelse och denna, så en sida kan nås mitt i en
# animation. `fetch = [{url, status, body}]` är inspelade svar som fetch_begin besvaras med
# när `net` beviljas (SPEC-5.2.7); manifestets net-origins gäller (SPEC-5.2.8) och dess
# storage-kvot och memory_max tillämpas. Värden äger fokus (SPEC-10.3.1):
# key_down 43 (Tab, med modifiers = 1 för Skift) når aldrig modulen utan flyttar värdens fokus
# genom trädets fokuserbara noder och blir FOCUS-händelser; ett pointer_down flyttar fokus till
# noden under pekaren först; ett scriptat focus sätter värdens fokus direkt. Modulen följer
# värdens fokus och kan inte begära det; en fokuserad nod som inte registreras i en frame
# förlorar fokus (SPEC-10.3.2).

[[case]]
name = "hello-800x600@1"
module = "hello"
width = 800
height = 600
scale = 1
semantic = "hello"

[[case]]
name = "hello-1280x800@1"
module = "hello"
width = 1280
height = 800
scale = 1

[[case]]
name = "hello-400x700@1"
module = "hello"
width = 400
height = 700
scale = 1

[[case]]
name = "hello-800x600@2"
module = "hello"
width = 800
height = 600
scale = 2

