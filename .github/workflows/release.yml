# Release: en tagg v* (eller en manuell körning med version) bygger vy-cli, vy-dev, vy-publish,
# vy-serve och vy-shell i release-läge för Linux x86_64, macOS arm64 och Windows x86_64 med
# tools/build_release.sh, packar Studio, publicerar referenssidan med tools/publish_site.sh och
# fäster allt vid en GitHub Release med genererade noteringar:
#
#   vy-<version>-<target>.zip   binärerna, studio.vyp bredvid vy-dev + LICENSE
#   vy-site-<version>.zip       de arton paketen (ett per utkast i conformance/manifests
#                               utom Studio, som bara körs lokalt av vy-dev), dev.key.pub
#                               och previews/
#   vy-conformance-<version>.zip  konformanssviten för andra klienter (SPEC-12.1.2,
#                               tools/package_conformance.sh)
#   SHA256SUMS                  SHA-256 för varje tillgång: plattformszipparna och varje fil i
#                               dem, sajt- och konformanszippen (deras innehåll täcks av
#                               zippens egen summa) och BUILD.md (SPEC-9.7.1)
#   BUILD.md                    byggreceptet: commit, SOURCE_DATE_EPOCH, maskiner,
#                               verktygskedja, kommandon (ur tools/BUILD.md.in)
#
# En manuell körning med `dry_run` är en generalrepetition: allt byggs, mäts mot SPEC-12.3.1,
# signeras och summeras som i en release, och SHA256SUMS och BUILD.md blir en artefakt, men
# jobbet `release` hoppas över: ingen tagg och ingen release skapas.
#
# Sist kör jobbet `smoke` releasens egen `vy-dev` som en utomstående gör: `vy-dev new` i en tom
# katalog och `vy-dev build`. Projektet pinnar SDK:t på taggen, så körningen faller om taggen
# inte går att hämta eller sidan inte bygger. I en repetition finns ingen tagg; då pekas
# projektet på arbetskopian med `--sdk`.
#
# Bygget är reproducerbart (SPEC-9.7.1): samma commit på samma klass av maskin ger samma
# binärer, oavsett katalog, användare och tid (tools/repro_env.sh), och zip-filerna skrivs
# med fasta tider och rättigheter (tools/release_files.py). CI:s jobb `repro` bygger två
# gånger och jämför. Actions är pinnade på commit; taggen står bredvid. docs/RELEASING.md
# beskriver allt, och vad ägaren behöver.
#
# Signeringsnyckeln för paketen är repots secret VY_KEY (64 hextecken, se
# tools/publish_site.sh); saknas den signeras de med en tillfällig nyckel.
#
# Kodsignering av binärerna (docs/RELEASING.md): Windows med Azure Artifact
# Signing (AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET,
# AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT, AZURE_SIGNING_PROFILE) eller
# en PFX (WINDOWS_PFX_BASE64, WINDOWS_PFX_PASSWORD); macOS med Developer ID och
# notarisering (APPLE_CERTIFICATE_P12_BASE64, APPLE_CERTIFICATE_PASSWORD,
# APPLE_SIGNING_IDENTITY, APPLE_API_KEY_P8_BASE64, APPLE_API_KEY_ID,
# APPLE_API_ISSUER_ID). Utan dem blir binärerna osignerade och jobbet grönt.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version att släppa, t.ex. v0.1.0 (taggen skapas på den valda commiten om den saknas)"
        required: true
        type: string
      dry_run:
        description: "Generalrepetition: bygg, mät, signera och summera allt, men skapa ingen tagg och ingen release"
        required: false
        type: boolean
        default: false

# Least privilege (granskning 0012:4): every job reads the repository; only
# `release` may write to it (the tag and the release).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The tag is the workspace version (every crate's, vy-sdk's included):
      # `vy-dev new` pins new projects to tag v<its own version>, so a release
      # whose tag is not that version would pin projects to a tag without
      # that SDK (docs/RELEASING.md).
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          tag="${INPUT_VERSION:-$GITHUB_REF_NAME}"
          tag="v${tag#v}"
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "error: version must look like v0.1.0, got $tag" >&2; exit 1 ;;
          esac
          workspace=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          if [ "$workspace" != "${tag#v}" ]; then
            echo "::error::tag $tag, but [workspace.package] version in Cargo.toml is $workspace: set it to ${tag#v} and commit first (docs/RELEASING.md)"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  binaries:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # No build cache: a release is built from a clean checkout, as BUILD.md says.
      - uses: dtolnay/rust-toolchain@f08ac54821369508305fcb9e0121ec6e30ae9ada # 1.97.0
        with:
          targets: wasm32-unknown-unknown, ${{ matrix.target }}
      - name: Environment
        run: |
          ext=""; py=python3
          if [ "$RUNNER_OS" = Windows ]; then ext=.exe; py=python; fi
          echo "EXT=$ext" >> "$GITHUB_ENV"
          echo "PY=$py" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
          echo "NAME=vy-$VERSION-$TARGET" >> "$GITHUB_ENV"
      # tools/repro_env.sh (sourced by the script) sets the path remapping and CFLAGS.
      - name: Build (SPEC-9.7.1)
        run: tools/build_release.sh "$TARGET" stage
      # The client is at most 25 000 000 bytes on every platform (SPEC-12.3.1,
      # decimal MB); every file's size is in the log and the client's in the
      # run summary.
      - name: Size (SPEC-12.3.1)
        run: |
          for f in stage/*; do printf '%10s  %s\n' "$(wc -c < "$f" | tr -d ' ')" "${f#stage/}"; done
          size=$(wc -c < "stage/vy-shell$EXT" | tr -d ' ')
          echo "::notice title=SPEC-12.3.1 $TARGET::vy-shell$EXT is $size bytes (cap 25000000)"
          echo "| \`$TARGET\` | vy-shell$EXT | $size bytes | cap 25 000 000 |" >> "$GITHUB_STEP_SUMMARY"
          if [ "$size" -gt 25000000 ]; then
            echo "::error::vy-shell$EXT is $size bytes, over SPEC-12.3.1's 25000000"
            exit 1
          fi
      - name: Hash the build
        run: |
          "$PY" tools/release_files.py sums "$NAME.unsigned" stage/* > unsigned.sha256
          cat unsigned.sha256
          identity=$("stage/vy-publish$EXT" inspect stage/studio.vyp | sed -n 's/^identity: *//p')
          [ -n "$identity" ] || { echo "error: no identity for studio.vyp" >&2; exit 1; }
          echo "STUDIO_IDENTITY=$identity" >> "$GITHUB_ENV"
      # Code signing (docs/RELEASING.md). Each way runs only when all of its
      # secrets exist; without them the binaries ship unsigned, with a notice,
      # and the job stays green. Some of them set is a warning, not a failure.
      - name: Signing secrets
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          # "azure" if every named secret is set; a warning when only some are.
          complete() {
            local way=$1 missing=() set=0; shift
            for v in "$@"; do
              if [ -n "${!v}" ]; then set=$((set + 1)); else missing+=("$v"); fi
            done
            if [ ${#missing[@]} -eq 0 ]; then return 0; fi
            if [ "$set" -gt 0 ]; then
              echo "::warning title=Signing ($way)::missing secrets ${missing[*]}; not signing this way"
            fi
            return 1
          }
          sign=none
          case "$RUNNER_OS" in
            Windows)
              if complete azure AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET \
                  AZURE_SIGNING_ENDPOINT AZURE_SIGNING_ACCOUNT AZURE_SIGNING_PROFILE; then
                sign=azure
              elif complete pfx WINDOWS_PFX_BASE64 WINDOWS_PFX_PASSWORD; then
                sign=pfx
              fi
              ;;
            macOS)
              if complete apple APPLE_CERTIFICATE_P12_BASE64 APPLE_CERTIFICATE_PASSWORD \
                  APPLE_SIGNING_IDENTITY APPLE_API_KEY_P8_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER_ID; then
                sign=apple
              fi
              ;;
          esac
          if [ "$sign" = none ] && [ "$RUNNER_OS" != Linux ]; then
            echo "::notice title=Unsigned $TARGET::no signing secrets; the binaries are not code-signed (docs/RELEASING.md)"
          fi
          echo "SIGN=$sign" >> "$GITHUB_ENV"
          if [ "$sign" = none ]; then echo "SIGNED=nej" >> "$GITHUB_ENV"; else echo "SIGNED=ja ($sign)" >> "$GITHUB_ENV"; fi
      # Windows, Azure Artifact Signing (formerly Trusted Signing): signtool
      # with Microsoft's signing client, every .exe, RFC 3161 timestamp.
      - name: Sign (Windows, Azure Artifact Signing)
        if: env.SIGN == 'azure'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\stage
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      # Windows, a code-signing certificate as a PFX file instead.
      - name: Sign (Windows, PFX)
        if: env.SIGN == 'pfx'
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL || 'http://timestamp.digicert.com' }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
          try {
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
              Sort-Object FullName | Select-Object -Last 1
            $exes = (Get-ChildItem stage\*.exe).FullName
            & $signtool.FullName sign /f $pfx /p $env:WINDOWS_PFX_PASSWORD /fd SHA256 `
              /tr $env:WINDOWS_TIMESTAMP_URL /td SHA256 $exes
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Remove-Item -Force $pfx
          }
      - name: Verify the signatures (Windows)
        if: env.SIGN == 'azure' || env.SIGN == 'pfx'
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName | Select-Object -Last 1
          & $signtool.FullName verify /pa /v (Get-ChildItem stage\*.exe).FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # macOS: Developer ID with the hardened runtime, then notarization. The
      # binaries that run wasmtime get tools/macos-entitlements.plist. A bare
      # binary cannot carry a stapled ticket; Gatekeeper looks it up online.
      - name: Sign and notarize (macOS, Developer ID)
        if: env.SIGN == 'apple'
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          kc="$RUNNER_TEMP/vy-signing.keychain-db"
          kcpass=$(openssl rand -hex 24)
          cleanup() {
            security delete-keychain "$kc" 2> /dev/null || true
            rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/notarize.zip"
          }
          trap cleanup EXIT
          security create-keychain -p "$kcpass" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpass" "$kc"
          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpass" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          for f in stage/vy-*; do
            entitlements=(--entitlements tools/macos-entitlements.plist)
            if [ "$(basename "$f")" = vy-serve ]; then entitlements=(); fi
            codesign --force --timestamp --options runtime "${entitlements[@]}" \
              --keychain "$kc" --sign "$APPLE_SIGNING_IDENTITY" "$f"
            codesign --verify --strict --verbose=2 "$f"
          done
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          ditto -c -k --keepParent stage "$RUNNER_TEMP/notarize.zip"
          result=$(xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --wait --timeout 30m \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" \
            --output-format json)
          echo "$result"
          status=$(printf '%s' "$result" | python3 -c 'import json, sys; print(json.load(sys.stdin).get("status", ""))')
          if [ "$status" != Accepted ]; then
            id=$(printf '%s' "$result" | python3 -c 'import json, sys; print(json.load(sys.stdin).get("id", ""))')
            [ -z "$id" ] || xcrun notarytool log "$id" --key "$RUNNER_TEMP/AuthKey.p8" \
              --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" || true
            echo "::error::notarization: $status"
            exit 1
          fi
      - name: Zip and hash
        run: |
          "$PY" tools/release_files.py zip stage "$NAME.zip"
          {
            "$PY" tools/release_files.py sums "$NAME" stage/*
            # A signed binary differs from the build only by its signature:
            # its unsigned hash is what a rebuild is compared with.
            if [ "$SIGNED" != nej ]; then cat unsigned.sha256; fi
            "$PY" tools/release_files.py sums "" "$NAME.zip"
          } > "$NAME.sha256"
          cat "$NAME.sha256"
          {
            echo "target=$TARGET"
            echo "tag=$TAG"
            echo "commit=$GITHUB_SHA"
            echo "epoch=$SOURCE_DATE_EPOCH"
            echo "runner=$RUNNER_OS $RUNNER_ARCH"
            echo "image=${ImageOS:-?} ${ImageVersion:-?}"
            echo "rustc=$(rustc -V)"
            echo "cargo=$(cargo -V)"
            echo "signed=$SIGNED"
            echo "studio_identity=$STUDIO_IDENTITY"
          } > "$NAME.build"
          cat "$NAME.build"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vy-${{ matrix.target }}
          path: |
            vy-*.zip
            vy-*.sha256
            vy-*.build
          if-no-files-found: error

  site:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@f08ac54821369508305fcb9e0121ec6e30ae9ada # 1.97.0
        with:
          targets: wasm32-unknown-unknown
      # No build cache, as in `binaries`: what signs the site is built here
      # from the checkout alone, never from what another run left behind
      # (granskning 0016:3).
      # Everything that compiles (the tools, their dependencies' build scripts,
      # the modules) runs here, without the signing key (granskning 0012:4).
      - name: Build the tools and the modules
        run: |
          cargo build --release --locked -p vy-publish -p vy-cli
          tools/build_modules.sh
      # The key is in the environment of this one step, which runs only what
      # the step above built: vy-publish signs, vy-cli renders the previews.
      - name: Sign and publish the reference site
        env:
          VY_KEY: ${{ secrets.VY_KEY }}
          VY_SITE_PREBUILT: 1
        run: |
          key=""
          if [ -n "$VY_KEY" ]; then
            umask 077
            printf '%s\n' "$VY_KEY" > "$RUNNER_TEMP/dev.key"
            key=$RUNNER_TEMP/dev.key
          fi
          tools/publish_site.sh deploy $key
          rm -f "$RUNNER_TEMP/dev.key"
      # m5/sdk: vy-conformance-<version>.zip, konformanssviten för andra klienter, som
      # release-tillgång (.github/actions/conformance; release-jobbet fäster artefakten).
      - name: Package the conformance suite
        uses: ./.github/actions/conformance
        with:
          version: ${{ needs.version.outputs.version }}
      # Ed25519 signatures are deterministic, so with VY_KEY the packages and
      # this zip are the same bytes for the same commit.
      - name: Zip
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          python3 tools/release_files.py zip deploy "vy-site-$VERSION.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vy-site
          path: vy-site-*.zip
          if-no-files-found: error

  # Everything a release attaches, gathered and summed: also in a dry run,
  # where this job's artifact is what there is to look at.
  sums:
    needs: [version, binaries, site]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: SHA256SUMS and BUILD.md (SPEC-9.7.1)
        run: |
          cd dist
          # Every file a release attaches has a line (granskning 0012:5): the
          # platform zips and the files in them, the site and conformance zips
          # (their contents are covered by the zip's own hash) and BUILD.md.
          python3 ../tools/release_files.py build-md ../tools/BUILD.md.in vy-*.build > BUILD.md
          {
            cat vy-*.sha256
            python3 ../tools/release_files.py sums "" vy-site-*.zip vy-conformance-*.zip BUILD.md
          } > SHA256SUMS
          cat SHA256SUMS BUILD.md
          ls -l
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vy-sums
          path: |
            dist/SHA256SUMS
            dist/BUILD.md
          if-no-files-found: error

  # Skipped in a dry run (`inputs` is empty for a tag push, so a tag
  # always releases).
  release:
    needs: [version, sums]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Vy ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/SHA256SUMS
            dist/BUILD.md
          fail_on_unmatched_files: true

  # The release as someone outside gets it (granskning 0012:3): a project
  # that the released `vy-dev new` writes pins the SDK to this release's
  # tag, so nothing shows that it can be fetched and built until the tag
  # exists. After the release, without `--sdk`: the run fails when the
  # tag cannot be fetched or the page does not build. In a dry run there
  # is no tag, and the project is pointed at the checkout instead.
  smoke:
    needs: [version, sums, release]
    if: ${{ !cancelled() && needs.sums.result == 'success' && (inputs.dry_run || needs.release.result == 'success') }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@f08ac54821369508305fcb9e0121ec6e30ae9ada # 1.97.0
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: vy-x86_64-unknown-linux-gnu
          path: dist
      - name: A new project builds
        run: |
          mkdir "$RUNNER_TEMP/vy"
          unzip -q "dist/vy-$VERSION-x86_64-unknown-linux-gnu.zip" -d "$RUNNER_TEMP/vy"
          vy_dev=$RUNNER_TEMP/vy/vy-dev
          project=$RUNNER_TEMP/smoke
          if [ "$DRY_RUN" = true ]; then
            "$vy_dev" new "$project" --sdk "$GITHUB_WORKSPACE"
          else
            "$vy_dev" new "$project"
            if ! grep -q "tag = \"$TAG\"" "$project/Cargo.toml"; then
              echo "::error::the new project does not pin vy-sdk to $TAG"
              cat "$project/Cargo.toml"
              exit 1
            fi
          fi
          "$vy_dev" build "$project"
