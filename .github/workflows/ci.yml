# Grindar enligt SPEC-12.2.1: fmt, clippy, test, spec-spårning, modulbygge + ABI-kontroll,
# och från M1 headless-rendering samt pixeldiff mot guldbilder (SPEC-12.2.2).
# `gates` på Ubuntu är grinden för allt; `platform` bygger, testar och kör konformans
# på macOS och Windows så att guldbilderna (sedan M3 även skalets) bevisas
# plattformsoberoende (SPEC-2.1.5, M1-grinden) och klienten bygger där den ska köras
# (Windows först, M3). `bench` körs informativt (SPEC-12.2.3 blir grind med tal från
# referensmaskinen).
name: ci
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Lint SDK for wasm32
        run: cargo clippy -p vy-sdk --target wasm32-unknown-unknown -- -D warnings
      # Modules first: the vy-cli tests render target/wasm/*.wasm.
      - name: Build modules
        run: tools/build_modules.sh
      - name: Test
        run: cargo test --workspace
      - name: Backlog (informational)
        run: "cargo test --workspace -- --ignored --list 2>/dev/null | grep -c 'test$' || true"
      - name: Spec trace
        run: python3 tools/spec_trace.py
      - name: ABI check
        run: for m in target/wasm/*.wasm; do cargo run -q -p vy-cli -- check-abi "$m"; done
      # Each module's own fmt, native tests and wasm32 clippy (beslut 33).
      - name: Module tests and lint
        run: tools/test_modules.sh
      # SPEC-11.3.1: headless render without a window.
      - name: Headless render
        run: cargo run -p vy-cli -- render target/wasm/hello.wasm --out /tmp/hello.png --size 800x600
      # SPEC-12.2.2: pixel diff at most 0.1 % against conformance/golden/,
      # the shell cases included (a tab process per case, SPEC-9.1.1).
      - name: Conformance
        run: cargo run -p vy-cli -- conformance
      # SPEC-9.6.1, SPEC-11.3.2: the windowed client builds, and its headless
      # screenshot is the same pipeline the window presents.
      - name: Build the client
        run: cargo build --release -p vy-shell
      - name: Shell screenshot
        run: target/release/vy-shell --screenshot /tmp/shell.png --size 1024x720 --manifest conformance/manifests/shop.json target/wasm/shop.wasm
      # SPEC §13, informational until SPEC-12.2.3 has reference numbers;
      # a debug build here, so the numbers only show that it runs
      # (`cargo run --release -p vy-cli -- bench` for the real ones).
      - name: Bench (informational)
        run: cargo run -p vy-cli -- bench --runs 3

  platform:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # The tools are bash scripts; GitHub's Windows runners have bash.
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build modules
        run: tools/build_modules.sh
      # Every failing test binary is reported, and the later checks run even
      # when tests fail, so one CI round shows everything a platform breaks.
      - name: Test
        run: cargo test --workspace --no-fail-fast
      - name: Module tests and lint
        if: ${{ !cancelled() }}
        run: tools/test_modules.sh
      # Same goldens as on Linux; a difference is reported, never papered over
      # with a looser threshold (docs/BUILD-NOTES.md, spec-fråga).
      - name: Conformance
        if: ${{ !cancelled() }}
        run: cargo run -p vy-cli -- conformance
      - name: Build the client
        run: cargo build --release -p vy-shell
      - name: Shell screenshot
        run: ./target/release/vy-shell --screenshot shell.png --size 1024x720 --manifest conformance/manifests/shop.json target/wasm/shop.wasm
      - name: Conformance diffs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-${{ matrix.os }}
          path: |
            conformance/golden/*.png.new
            conformance/semantic/*.json.new
          if-no-files-found: ignore

  # SPEC §13 in release (a debug build only reports the budgets), then the
  # SPEC-12.2.3 gate: no row's P50 more than 5 % plus a noise floor over the
  # committed baseline of this runner class (conformance/bench/ubuntu.json,
  # changed only in a `bench:` commit). Without that file the report is
  # uploaded, to be committed as the first baseline.
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build modules
        run: tools/build_modules.sh
      - name: Budget tests (release)
        run: cargo test --release -p vy-render -p vy-runtime -p vy-cli -- spec_13 spec_6_2_2 spec_12_2_3 --test-threads=1
      - name: Regression gate (SPEC-12.2.3)
        run: |
          cargo build --release -p vy-cli
          cp target/release/vy-cli "$RUNNER_TEMP/vy-cli"
          if [ -f conformance/bench/ubuntu.json ]; then
            "$RUNNER_TEMP/vy-cli" bench --runs 100 --json --compare conformance/bench/ubuntu.json > bench-ubuntu.json
          else
            "$RUNNER_TEMP/vy-cli" bench --runs 100 --json > bench-ubuntu.json
            echo "::notice::no conformance/bench/ubuntu.json: commit the bench-ubuntu artifact as that file in a bench: commit"
          fi
      - name: Upload the bench report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-ubuntu
          path: bench-ubuntu.json
          if-no-files-found: ignore
