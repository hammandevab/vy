# Grindar enligt SPEC-12.2.1: fmt, clippy, test, spec-spårning, modulbygge + ABI-kontroll,
# och från M1 headless-rendering samt pixeldiff mot guldbilder (SPEC-12.2.2).
# `gates` på Ubuntu är grinden för allt; `platform` bygger, testar och kör konformans
# på macOS och Windows så att guldbilderna (sedan M3 även skalets) bevisas
# plattformsoberoende (SPEC-2.1.5, M1-grinden) och klienten bygger där den ska köras
# (Windows först, M3). `bench` körs informativt (SPEC-12.2.3 blir grind med tal från
# referensmaskinen).
name: ci
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Least privilege (granskning 0012:4): no job writes to the repository.
permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Lint SDK for wasm32
        run: cargo clippy -p vy-sdk --target wasm32-unknown-unknown -- -D warnings
      # Modules first: the vy-cli tests render target/wasm/*.wasm.
      - name: Build modules
        run: tools/build_modules.sh
      - name: Test
        run: cargo test --workspace
      # SPEC-11.3.2: the window's GL path against the reference, on Mesa's
      # software GL (llvmpipe) under Xvfb. `cargo test` above skips it for
      # want of a display; here it must run (VY_GL_REQUIRED). Its timing
      # line is not a GPU's (docs/notes/m5-gpu.md).
      # libxkbcommon-x11 is what winit loads for the keyboard of an X11 window;
      # a desktop has it, the runner image does not.
      - name: Install Mesa and Xvfb
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1-mesa-dri libegl1 libegl-mesa0 libxkbcommon0 libxkbcommon-x11-0 xvfb
      - name: GL path against the reference (llvmpipe)
        run: xvfb-run -a -s "-screen 0 1600x1200x24" env VY_GL_REQUIRED=1 cargo test -p vy-shell --test gl
      - name: Backlog (informational)
        run: "cargo test --workspace -- --ignored --list 2>/dev/null | grep -c 'test$' || true"
      - name: Spec trace
        run: python3 tools/spec_trace.py
      - name: ABI check
        run: for m in target/wasm/*.wasm; do cargo run -q -p vy-cli -- check-abi "$m"; done
      # Each module's own fmt, native tests and wasm32 clippy (beslut 33).
      - name: Module tests and lint
        run: tools/test_modules.sh
      # SPEC-11.3.1: headless render without a window.
      - name: Headless render
        run: cargo run -p vy-cli -- render target/wasm/hello.wasm --out /tmp/hello.png --size 800x600
      # SPEC-12.2.2: pixel diff at most 0.1 % against conformance/golden/,
      # the shell cases included (a tab process per case, SPEC-9.1.1).
      - name: Conformance
        run: cargo run -p vy-cli -- conformance
      # SPEC-9.6.1, SPEC-11.3.2: the windowed client builds, and its headless
      # screenshot is the same pipeline the window presents.
      - name: Build the client
        run: cargo build --release -p vy-shell
      - name: Shell screenshot
        run: target/release/vy-shell --screenshot /tmp/shell.png --size 1024x720 --manifest conformance/manifests/shop.json target/wasm/shop.wasm
      # SPEC §13, informational until SPEC-12.2.3 has reference numbers;
      # a debug build here, so the numbers only show that it runs
      # (`cargo run --release -p vy-cli -- bench` for the real ones).
      - name: Bench (informational)
        run: cargo run -p vy-cli -- bench --runs 3

  platform:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # The tools are bash scripts; GitHub's Windows runners have bash.
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build modules
        run: tools/build_modules.sh
      # Every failing test binary is reported, and the later checks run even
      # when tests fail, so one CI round shows everything a platform breaks.
      - name: Test
        run: cargo test --workspace --no-fail-fast
      - name: Module tests and lint
        if: ${{ !cancelled() }}
        run: tools/test_modules.sh
      # Same goldens as on Linux; a difference is reported, never papered over
      # with a looser threshold (docs/BUILD-NOTES.md, spec-fråga).
      - name: Conformance
        if: ${{ !cancelled() }}
        run: cargo run -p vy-cli -- conformance
      - name: Build the client
        run: cargo build --release -p vy-shell
      - name: Shell screenshot
        run: ./target/release/vy-shell --screenshot shell.png --size 1024x720 --manifest conformance/manifests/shop.json target/wasm/shop.wasm
      # SPEC-13.2.1 on this platform, informational (see the bench job).
      - name: Raster budget on this runner (informational)
        if: ${{ !cancelled() }}
        run: cargo test --release -p vy-render --lib -- --ignored spec_13_2_1 --nocapture || true
      - name: Conformance diffs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-${{ matrix.os }}
          path: |
            conformance/golden/*.png.new
            conformance/semantic/*.json.new
          if-no-files-found: ignore

  # SPEC §13 in release (a debug build only reports the budgets), then the
  # SPEC-12.2.3 gate: no row's P50 more than 5 % plus a noise floor over the
  # committed baseline of this runner class (conformance/bench/ubuntu.json,
  # changed only in a `bench:` commit). Without that file the report is
  # uploaded, to be committed as the first baseline.
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build modules
        run: tools/build_modules.sh
      - name: Budget tests (release)
        run: cargo test --release -p vy-render -p vy-runtime -p vy-cli -- spec_13 spec_6_2_2 spec_12_2_3 --test-threads=1
      # SPEC-13.2.1 stays ignored until a path meets it (docs/notes/m5-gpu.md,
      # spec-fråga 66): what the window's path takes on this runner, for the
      # notes; never fails the job.
      - name: Raster budget on this runner (informational)
        run: cargo test --release -p vy-render --lib -- --ignored spec_13_2_1 --nocapture || true
      - name: Regression gate (SPEC-12.2.3)
        run: |
          cargo build --release -p vy-cli
          cp target/release/vy-cli "$RUNNER_TEMP/vy-cli"
          if [ -f conformance/bench/ubuntu.json ]; then
            "$RUNNER_TEMP/vy-cli" bench --runs 100 --json --compare conformance/bench/ubuntu.json > bench-ubuntu.json
          else
            "$RUNNER_TEMP/vy-cli" bench --runs 100 --json > bench-ubuntu.json
            echo "::notice::no conformance/bench/ubuntu.json: commit the bench-ubuntu artifact as that file in a bench: commit"
          fi
      - name: Upload the bench report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-ubuntu
          path: bench-ubuntu.json
          if-no-files-found: ignore

  # SPEC-9.7.1: this commit's release, built twice by tools/build_release.sh (what
  # release.yml runs) in two worktrees at different paths, with two CARGO_HOMEs (two
  # registry paths, as two users have), in two time zones and minutes apart: every binary
  # and LICENSE has the same SHA-256, and studio.vyp, signed with a throwaway key each
  # time, the same package identity. Too slow for `cargo test`, which checks the modules
  # the same way (spec_9_7_1_reproducible_build). A gate on all three platforms since
  # each has passed (docs/notes/m5-slut.md).
  repro:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      # As release.yml: no -D warnings in the flags of the build that is compared.
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: wasm32-unknown-unknown, ${{ matrix.target }}
      - name: Build the release twice
        run: |
          tmp=$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || printf '%s' "$RUNNER_TEMP")
          native() { cygpath -w "$1" 2>/dev/null || printf '%s' "$1"; }
          git worktree add --detach "$tmp/a/vy" HEAD
          git worktree add --detach "$tmp/b/somewhere/else/vy" HEAD
          (cd "$tmp/a/vy" && TZ=UTC tools/build_release.sh ${{ matrix.target }} "$tmp/stage-a")
          mkdir -p "$tmp/cargo-b"
          (cd "$tmp/b/somewhere/else/vy" && CARGO_HOME=$(native "$tmp/cargo-b") TZ=Asia/Tokyo \
            tools/build_release.sh ${{ matrix.target }} "$tmp/stage-b")
      - name: Compare
        run: |
          tmp=$(cygpath -u "$RUNNER_TEMP" 2>/dev/null || printf '%s' "$RUNNER_TEMP")
          py=python3; ext=""
          if [ "$RUNNER_OS" = Windows ]; then py=python; ext=.exe; fi
          for s in stage-a stage-b; do
            {
              "$py" tools/release_files.py sums "" "$tmp/$s"/vy-* "$tmp/$s/LICENSE"
              "$tmp/$s/vy-publish$ext" inspect "$tmp/$s/studio.vyp" | grep '^identity:'
            } > "$tmp/$s.sums"
          done
          cat "$tmp/stage-a.sums"
          if ! diff "$tmp/stage-a.sums" "$tmp/stage-b.sums"; then
            # Where the smallest binary differs, for whoever has to find out why.
            a="$tmp/stage-a/vy-serve$ext"; b="$tmp/stage-b/vy-serve$ext"
            echo "vy-serve: $(cmp -l "$a" "$b" | wc -l) bytes differ, the first of them:"
            cmp -l "$a" "$b" | head -n 40 || true
            if command -v strings > /dev/null; then
              diff <(strings -a "$a") <(strings -a "$b") | head -n 60 || true
            fi
            if command -v otool > /dev/null; then
              diff <(otool -l "$a") <(otool -l "$b") | head -n 60 || true
            fi
            echo "::error::the two release builds differ (SPEC-9.7.1)"
            exit 1
          fi

  # SPEC-12.3.1: the client binary in release, stripped by the release
  # profile, against 25 000 000 bytes (spec_12_3_1_size_budget, which only
  # reports in a debug build). release.yml prints every platform's size.
  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build the client (release)
        run: cargo build --release --locked -p vy-shell
      - name: Size budget (SPEC-12.3.1)
        run: |
          wc -c target/release/vy-shell
          cargo test --release --locked -p vy-cli --lib spec_12_3_1 -- --nocapture
